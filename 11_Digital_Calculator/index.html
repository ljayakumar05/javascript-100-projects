<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Calculator</title>
    <link rel="stylesheet" href="/11_Digital_Calculator/style.css">
</head>

<body>
    <div class="container">
        <div class="calculator">
            <form action="">
                <div>
                    <input type="text" id="display" class="display">
                </div>
                <div>
                    <input type="button" id="clear" value="AC">
                    <input type="button" id="delete"value="DEL">
                    <input type="button" id="dot" value=".">
                    <input type="button" id="divide" value="/">
                </div>
                <div>
                    <input type="button" class="number" value="7">
                    <input type="button" class="number" value="8">
                    <input type="button" class="number" value="9">
                    <input type="button" id="multiply" value="*">
                </div>
                <div>
                    <input type="button" class="number" value="4">
                    <input type="button" class="number" value="5">
                    <input type="button" class="number" value="6">
                    <input type="button" id="subtract" value="-">
                </div>
                <div>
                    <input type="button" class="number" value="1">
                    <input type="button" class="number" value="2">
                    <input type="button" class="number" value="3">
                    <input type="button" id="add" value="+">
                </div>
                <div>
                    <input type="button" id="zerozero" value="00">
                    <input type="button" id="zero" value="0">
                    <input type="button" id="equal" value="=">
                </div>
            </form>
        </div>
    </div> 
    
  
    <script src="/11_Digital_Calculator/script.js"></script> 
</body>

</html>
