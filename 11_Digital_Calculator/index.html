
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <form>
                <div>
                    <input type="text" id="display"
                           class="display" readonly>
                </div>

                <div>
                    <input type="button" id="clear" value="AC">
                    <input type="button" id="delete" value="DEL">
                    <input type="button" id="dot" value=".">
                    <input type="button" class="operator" id="divide" value="/">
                </div>

                <div>
                    <input type="button" class="number" value="7">
                    <input type="button" class="number" value="8">
                    <input type="button" class="number" value="9">
                    <input type="button" class="operator" id="multiply" value="*">
                </div>

                <div>
                    <input type="button" class="number" value="4">
                    <input type="button" class="number" value="5">
                    <input type="button" class="number" value="6">
                    <input type="button" class="operator" id="subtract" value="-">
                </div>

                <div>
                    <input type="button" class="number" value="1">
                    <input type="button" class="number" value="2">
                    <input type="button" class="number" value="3">
                    <input type="button" class="operator" id="add" value="+">
                </div>

                <div>
                    <input type="button" class="number" id="zerozero" value="00">
                    <input type="button" class="number" id="zero" value="0">
                    <input type="button" id="equal" value="=">
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
