<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="/09_Stopwatch/style.css">
</head>

<body>
    <div class="stopwatch-head">
        <h2>stopwatch <span class="headText">App</span></h2>
    </div>
    <div class="watchContainer">
            <h1 id="timer" class="timer">00 : 00 : 00</h1>
            <div class="counterBtn">
                <button id="startBtn">START</button>
                <button id="stopBtn">STOP</button>
                <button id="resetBtn">RESET</button>
            </div>
    </div>
  
    <script src="/09_Stopwatch/script.js"></script>
</body>

</html>
