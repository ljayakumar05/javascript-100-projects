<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript-projects</title>
    <link rel="stylesheet" href="/02_BMI_Calculator/style.css">
</head>
<body>
    <div class="container">
    <h1>BMI Calculator - Javascript</h1>
    <div class="container-form">
        <label for="height">Height (cm)</label>
        <input type="number" class="input" id="height">

        <label for="weight">Weight (kg)</label>
        <input type="number" class="input" id="weight">
        

        <button class="btn" id="btn">compute BMI</button>
        <input type="text" class="input" id="bmi-result">    
        
        <button onclick="reload()">Clear</button>

        <h4 class="info-text" id="heading">Weight Condition
        <span id="weight-condition"></span></h4>
    </div>
    </div>

    <script src="/02_BMI_Calculator/script.js"></script>
</body>
</html>
