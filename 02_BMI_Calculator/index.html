<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript-projects</title>
    <link rel="stylesheet" href="/02_BMI_Calculator/style.css">
</head>
<body>
    <div class="container">
    <h1>BMI Calculator - Javascript</h1>
    <div class="container-form">
        <label for="weight">Weight (lbs)</label>
        <input type="number" id="weight">
        <label for="height">Height (in)</label>
        <input type="number" id="height">

        <button onclick="calculateBmi()">Submit</button>
        <button onclick="reload()">Clear</button>

        <h4 id="heading"></h4>
        <p id="bmi-output"></p>
        <p id="message"></p>
    </div>
    </div>

    <script src="/02_BMI_Calculator/script.js"></script>
</body>
</html>
