<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="/07_Character_Counter/style.css">
</head>

<body>
    <div class="container">
        <div class="head">
            <h1 class="header-text">Character Counter</h1>
            <h2>Counter Your characters in real time</h2>
        </div>
        <textarea id="message" class="character_text" maxlength="200"></textarea> 
        <div class="counter">
            <p>Characters:</p>
            <p id="textCount">0 / 300</p>
        </div>
        <h2 class="statistics-head">Statistics</h2>
        <div class="statistics">
            <div class="text-values">
                <p class="value" id="words">0</p>
                <p>Characters</p>
            </div>
            <div class="text-values">
                <p class="value" id="NoSpace">0</p>
                <p>No Space</p>
            </div>
            <div class="text-values">
                <p class="value" id="totalWords">0</p>
                <p>Words</p>
            </div>
        </div>
        <div class="statistics">
            <div class="text-values">
                <p class="value" id="lineCount">0</p>
                <p>Line Count</p>
            </div>
        </div>
    </div>
 
    <script src="/07_Character_Counter/script.js"></script>
</body>

</html>
