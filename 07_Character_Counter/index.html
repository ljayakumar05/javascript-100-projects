<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="/07_Character_Counter/style.css">
</head>

<body>
    <div class="container">
        <div class="head">
            <h1 class="header-text">Character Counter</h1>
            <h2>Counter Your characters in real time</h2>
        </div>
        <textarea id="message" class="character_text"></textarea> 
        <div class="counter">
            <p>Characters:</p>
            <p id="textCount">0 / 200</p>
        </div>
    </div>
 
    <script src="/07_Character_Counter/script.js"></script>
</body>

</html>
