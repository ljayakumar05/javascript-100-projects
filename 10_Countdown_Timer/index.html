<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="/10_Countdown_Timer/style.css">
</head>

<body>
    <div class="counter-head">
        <h2>Countdowm <span class="headText">Timer</span></h2>
    </div> 
    <div class="countContainer">
        <h3 class="countHeadtwo">Set your time and stay focused</h3>
        <!-- Set time input -->
        <div class="timeSet">
            <div class="setInput">
                <p>Hours</p>
                <input type="number" id="hoursInput" class="input" min="0" max="59" value="0">
            </div>
            <div class="setInput">
                <p>Minutes</p>
                <input type="number" id="minutesInput" class="input" min="0" max="59" value="0">
            </div>
            <div class="setInput">
                <p>Seconds</p>
                <input type="number" id="secondsInput" class="input" min="0" max="59" value="0">
            </div>
        </div>
        <!-- Time display -->
         <div class="timeDisplay">
            <p class="displayTime" id="timer">00 : 00</p>
         </div>
         <!-- Time control button -->
         <div class="controlBtn">
            <button class="timeBtn btnStart" id="startBtn">Start</button>
            <button class="timeBtn btnPause" id="pauseBtn">Pause</button>
            <button class="timeBtn btnReset" id="resetBtn">Reset</button>
         </div> 

         <p class="timeMessage" id="message"></p>
    </div>
  
    <script src="/10_Countdown_Timer/script.js"></script> 
</body>

</html>
