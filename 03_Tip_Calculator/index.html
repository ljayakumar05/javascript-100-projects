<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript-projects</title>
    <link rel="stylesheet" href="/03_Tip_Calculator/style.css">
</head>

<body class="full-container">
    <div class="container">
        <div class="container-form">
            <h1>Tip Calculator</h1>
            <p>Calculate your bill and split the tip</p>
            
            <div class="tip-form">
                <div class="input-amount">
                    <label class="amount-head">Bill Amount (₹)</label><br>
                    <input type="number" id="userAmount" class="amount-input" placeholder="Add Amount">
                </div>
                <div class="input-tip">
                    <label class="amount-head">Section Tip</label><br>
                    <ul class="amount-tip">
                        <li class="amount-tip-list"><button type="button" class="tip-btn">5%</button></li>
                        <li class="amount-tip-list"><button type="button" class="tip-btn">10%</button></li>
                        <li class="amount-tip-list"><button type="button" class="tip-btn">15%</button></li>
                        <li class="amount-tip-list"><button type="button" class="tip-btn">20%</button></li>
                    </ul>
                </div> 
                <div class="input-people">
                    <label class="amount-head">Number of People</label><br>
                    <input type="number" id="peopleList" class="amount-input" placeholder="Add people">
                </div> 
                <textarea rows="5" cols="5" id="userValueDisplay" class="tip-area" placeholder="Tip Amount and Total Bill"></textarea>  
                
                <button class="reset-btn" id="submitBtn">Submit</button>
            </div>
        </div>
    </div>

    <script src="/03_Tip_Calculator/script.js"></script>
</body>

</html>
