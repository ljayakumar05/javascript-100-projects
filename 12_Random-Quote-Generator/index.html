
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="quoteTitle">Quote of the day</h1>
        <p class="quoteMessage">Lorem ipsum dolor sit amet consectetur, adipisicing elit. 
            Incidunt commodi quaerat fuga, dolorum ipsam ad maxime id 
            minus magnam dolores eum totam mollitia.</p>
        <p class="quoteAuther">-- Leo Buseaglia</p>    
        <div class="quotBtn">
            <button class="nextBtn">New Quote</button>
            <button class="shareBtn">Tweet</button>
        </div>    
    </div>

    <script src="script.js"></script>
</body>
</html>
