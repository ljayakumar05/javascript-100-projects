
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="quoteTitle">Quote of the day</h1>
        <p class="quoteMessage" id="quote"></p>
        <p id="userId" class="userId"></p>    
        <p class="quoteAuther" id="author">-- Leo Buseaglia</p>    
        <div class="quotBtn">
            <button class="nextBtn" id="newQuote">New Quote</button>
            <button class="shareBtn" id="tweet">Tweet</button>
        </div>    
    </div>

    <script src="script.js"></script>
</body>
</html>
